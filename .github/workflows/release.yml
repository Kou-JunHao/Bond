name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 2.1.4"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  client:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          pwsh scripts/build-installer.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: bond-client-installer
          path: publish/installer/*.exe
          if-no-files-found: error

  server:
    name: Build server jars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package
        run: mvn -B -ntp -f BondServer/pom.xml -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: bond-server-jars
          path: BondServer/*/target/*.jar
          if-no-files-found: error

  admin:
    name: Build admin web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: admin-web/pnpm-lock.yaml
      - name: Install
        working-directory: admin-web
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: admin-web
        run: pnpm exec vue-tsc --noEmit && pnpm exec vite build
      - uses: actions/upload-artifact@v4
        with:
          name: bond-admin-dist
          path: admin-web/dist
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [client, server, admin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Pack artifacts
        run: |
          cd artifacts
          zip -r bond-server-jars.zip bond-server-jars
          zip -r bond-admin-dist.zip bond-admin-dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/bond-client-installer/*.exe
            artifacts/bond-server-jars.zip
            artifacts/bond-admin-dist.zip
          generate_release_notes: true
